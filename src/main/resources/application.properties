server.port=${PORT:9090}

# Main Application URL to forward alerts to
main.application.url=${MAIN_APPLICATION_URL:http://localhost:8080}

# Allowed CORS frontend origin
cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# Application name
spring.application.name=cyberpulse-gateway

# Logging configuration
logging.level.com.cyberpulse.gateway=INFO
