# Allowed CORS frontend origin
cors.allowed-origin=${FRONTEND_URL:https://thrive-frontend1.vercel.app,http://localhost:5173,*}

# Application name
spring.application.name=cyberpulse-gateway

# Logging configuration
logging.level.com.cyberpulse.gateway=INFO
