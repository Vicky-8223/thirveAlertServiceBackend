services:
  - type: web
    name: cyberpulse-alert-gateway
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: MAIN_APPLICATION_URL
        value: https://cyber-priority-engine.onrender.com
      - key: FRONTEND_URL
        value: "https://thrive-frontend2-chi.vercel.app,https://thrive-frontend1.vercel.app,*"
